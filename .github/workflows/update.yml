name: Auto Update IPTV Playlist

on:
  schedule:
    # প্রতি ১৫ মিনিট পর পর স্বয়ংক্রিয়ভাবে রান হবে
    - cron: '*/15 * * * *'
  workflow_dispatch: # প্রয়োজন হলে ম্যানুয়ালি রান করার জন্য

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 googletrans==4.0.0-rc1

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto-update playlist [skip ci]" && git push)
